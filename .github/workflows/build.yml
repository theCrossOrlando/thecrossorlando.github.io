name: Build
on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: master
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Deploy even if the built output is unchanged"
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  # Decide whether anything actually needs rebuilding. Pushes and manual runs
  # always build; scheduled runs only build when the RSS feed's posts changed
  # since the last successful deploy (so the nightly cron stops redeploying
  # identical output).
  check:
    name: check feed
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      hash: ${{ steps.fp.outputs.hash }}
      feed_ok: ${{ steps.fp.outputs.feed_ok }}
    steps:
      - name: Fingerprint the RSS feed
        id: fp
        run: |
          set +e
          body=$(curl -fsSL --retry 3 --max-time 30 "https://tcandk.wordpress.com/feed/")
          rc=$?
          set -e
          if [ $rc -ne 0 ] || [ -z "$body" ]; then
            echo "Feed fetch failed (rc=$rc); building to be safe."
            echo "feed_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Hash only the item GUIDs — <lastBuildDate>/<pubDate> churn on every
          # fetch and would otherwise look like a change.
          guids=$(printf '%s' "$body" | grep -oE '<guid[^>]*>[^<]*</guid>' || true)
          if [ -z "$guids" ]; then
            echo "No <guid> entries parsed; building to be safe."
            echo "feed_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hash=$(printf '%s' "$guids" | sha256sum | cut -d' ' -f1)
          echo "Feed fingerprint: $hash"
          echo "feed_ok=true" >> "$GITHUB_OUTPUT"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
      - name: Restore last deployed fingerprint
        id: cache
        if: steps.fp.outputs.feed_ok == 'true'
        uses: actions/cache/restore@v6
        with:
          path: .feed-fingerprint
          key: rss-feed-${{ steps.fp.outputs.hash }}
          lookup-only: true
      - name: Decide
        id: decide
        run: |
          if [ "${{ steps.fp.outputs.feed_ok }}" != "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "${{ github.event_name }} event: building."
            echo "should_build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
            echo "Feed unchanged since last deploy: skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Feed changed: building."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi
  build:
    name: 11ty build
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    outputs:
      out_hash: ${{ steps.hash.outputs.out_hash }}
      unchanged: ${{ steps.gate.outputs.unchanged }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
      - name: Build
        run: |
          npm ci
          npm run build
      # Pages stamps Last-Modified/ETag at extraction time, so redeploying
      # identical output re-dates feed.xml and can re-notify podcast apps.
      - name: Hash the built output
        id: hash
        run: |
          out_hash=$(find _site -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          echo "Output hash: $out_hash"
          echo "out_hash=$out_hash" >> "$GITHUB_OUTPUT"
      - name: Look up the last deployed output
        id: out_cache
        uses: actions/cache/restore@v6
        with:
          path: .site-output
          key: site-output-${{ steps.hash.outputs.out_hash }}
          lookup-only: true
      - name: Decide whether to deploy
        id: gate
        run: |
          if [ "${{ inputs.force_deploy }}" = "true" ]; then
            echo "force_deploy set: deploying."
            echo "unchanged=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ steps.out_cache.outputs.cache-hit }}" = "true" ]; then
            echo "Output identical to the last deploy: skipping deploy."
            echo "unchanged=true" >> "$GITHUB_OUTPUT"
          else
            echo "Output changed: deploying."
            echo "unchanged=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload artifact
        if: steps.gate.outputs.unchanged != 'true'
        uses: actions/upload-pages-artifact@v5
  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.unchanged != 'true'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
  # Record fingerprints only after a successful run, so a failed build never
  # makes a later run skip a real change. Also runs when the deploy was gated
  # out, otherwise the feed fingerprint would never settle and the nightly
  # cron would rebuild forever.
  record:
    needs: [check, build, deploy]
    if: >-
      !cancelled()
      && needs.build.result == 'success'
      && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Save deployed fingerprints
        run: |
          mkdir -p .feed-fingerprint .site-output
          echo "${{ needs.check.outputs.hash }}" > .feed-fingerprint/hash
          echo "${{ needs.build.outputs.out_hash }}" > .site-output/hash
      - name: Save feed fingerprint
        if: needs.check.outputs.feed_ok == 'true'
        uses: actions/cache/save@v6
        with:
          path: .feed-fingerprint
          key: rss-feed-${{ needs.check.outputs.hash }}
      - name: Save output hash
        if: needs.deploy.result == 'success'
        uses: actions/cache/save@v6
        with:
          path: .site-output
          key: site-output-${{ needs.build.outputs.out_hash }}
